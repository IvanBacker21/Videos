html,body{margin:0;padding:0;background:#000;overflow:hidden}

canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov{position:absolute;inset:0;pointer-events:none;font-family:"Poppins",sans-serif}
/* subtítulos arriba, palabra por palabra (dichas en blanco, próximas en gris, actual con recuadro) */
#cap{position:absolute;left:90px;right:90px;top:250px;text-align:center;font-weight:700;font-size:66px;line-height:1.22;letter-spacing:-.5px;

#cap span{color:rgba(255,255,255,.38);transition:none;padding:0 6px;border-radius:12px}
#cap span.on{color:#fff}
#cap span.cur{color:#fff;outline:4px solid rgba(120,190,255,.95);outline-offset:2px;background:rgba(40,90,160,.25)}
/* rótulo inferior: caja oscura con borde dorado */
.lt{position:absolute;left:50%;transform:translate(-50%,0) scale(var(--s,1));transform-origin:50% 50%;

.lt .t{color:#f3c54d;font-weight:900;font-size:76px;line-height:1.05;letter-spacing:-.5px}
.lt .s{color:#fff;font-weight:800;font-size:26px;letter-spacing:1.5px;margin-top:6px;text-transform:uppercase}
.tag3d{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:900;font-size:58px;letter-spacing:.5px;
       text-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);white-space:nowrap}

.tag3d.pill{background:rgba(18,16,12,.78);border:3px solid rgba(217,169,58,.85);border-radius:999px;padding:6px 30px 4px;text-shadow:none}
#brand{position:absolute;top:120px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-weight:800;font-size:32px;letter-spacing:4px}
#bar{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#f3c54d,#ff7a59)}
</style>
