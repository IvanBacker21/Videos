  const rect = (w, h, r = .02) => { const s = new THREE.Shape(); s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r); s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2); return s; };
  const circ = (r, irr = .02) => { const s = new THREE.Shape(); for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2, rr = r * (1 + (Math.random() - .5) * irr); i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(rr, 0); } return s; };
  const ola = (w, amp, y0) => { const s = new THREE.Shape(); s.moveTo(-w / 2, -3); for (let i = 0; i <= 40; i++) { const x = -w / 2 + i / 40 * w; s.lineTo(x, y0 + Math.sin(i * .7) * amp); } s.lineTo(w / 2, -3); return s; };
  capa(rect(6, 9), 0x1f4e79, -.6); capa(circ(.45), 0xffe08a, -.5, [.85, 1.9]);                                         // fondo mar de noche + luna
  for (let k = 0; k < 14; k++) capa(circ(.03, .3), 0xffffff, -.55, [(Math.random() - .5) * 2.6, 1 + Math.random() * 2.2]);
  capa(ola(6, .08, .25), 0x2a6aa8, -.4); capa(ola(6, .1, -.15), 0x3a86c8, -.25); capa(ola(6, .12, -.6), 0x56a8e0, -.1);
  // pulpo de papel
  const pu = G([0, .25, 0]);
  const cab = new THREE.Shape(); cab.moveTo(-.4, -.05); cab.bezierCurveTo(-.55, .75, .55, .75, .4, -.05); cab.quadraticCurveTo(0, -.18, -.4, -.05);
  capa(cab, 0xd95a9a, 0, [0, 0], pu);
  for (let k = 0; k < 6; k++) {                                       // tentáculos enroscados de papel
    const x0 = -.33 + k * .132, dir = k < 3 ? -1 : 1, t = new THREE.Shape();
    t.moveTo(x0 - .05, -.05); t.bezierCurveTo(x0 - .06, -.35, x0 + dir * .25, -.45, x0 + dir * .22, -.62); t.bezierCurveTo(x0 + dir * .14, -.7, x0 + dir * .08, -.6, x0 + dir * .14, -.56);
    t.bezierCurveTo(x0 + dir * .12, -.45, x0 + .02, -.35, x0 + .05, -.05); t.lineTo(x0 - .05, -.05);
    capa(t, k % 2 ? 0xc94a8a : 0xe06aa6, -.01 + (k % 2) * .005, [0, 0], pu);
    for (let v = 0; v < 2; v++) capa(circ(.018), 0xffc2dc, .01, [x0 + dir * (.03 + v * .1), -.2 - v * .17], pu);
  }
  for (const s of [-1, 1]) { capa(circ(.1), 0xffffff, .03, [s * .15, .22], pu); capa(circ(.05), 0x111111, .05, [s * .15, .22], pu); }
  const bo = capa(circ(.05), 0x7a1f3a, .03, [0, .02], pu); bo.scale.y = 1.3;
  for (let k = 0; k < 3; k++) { const c = new THREE.Shape(); c.moveTo(0, -.12); c.bezierCurveTo(-.22, .05, -.11, .2, 0, .09); c.bezierCurveTo(.11, .2, .22, .05, 0, -.12); capa(c, 0xff4060, .1 + k * .01, [-.45 + k * .45, .95 + (k % 2) * .12], pu); }
  capa(ola(6, .1, -1.05), 0x7cc6f2, .15);                                                                               // ola de enfrente
  sc.add(new THREE.HemisphereLight(0xffffff, 0xbba98a, 1.6)); const s = sol(2.0, [-1.5, 2.5, 5]); s.shadow.radius = 10;
  cam.position.set(0, .55, 5.4); cam.lookAt(0, .55, 0); cam.fov = 38;
  texto('<span style="font-size:84px;color:#fff8ea;text-shadow:3px 4px 0 #1f4e79">El pulpo tiene</span>', 260);
  texto('<span style="font-size:126px;color:#ffe08a;text-shadow:4px 6px 0 #1f4e79">3 corazones</span>', 355);
}
cam.updateProjectionMatrix();
if (bloom) { const cp = new EffectComposer(R); cp.addPass(new RenderPass(sc, cam)); cp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), bloom, .5, .8)); cp.addPass(new OutputPass()); cp.render(); }
else R.render(sc, cam);
window.__done = true;
}
